<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Hôtels — Recherche de chambres</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --rose:#E8C4C4; --rose-d:#C9908A; --rose-p:#F9F0F0; --rose-dk:#8B5E5B;
  --beige:#FAF4F0; --beige2:#EDE0DA; --brown:#5C3D3A; --muted:#A89090;
  --white:#FFFFFF; --green:#5A8A5A; --red:#C05050;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Jost',sans-serif;font-weight:300;background:var(--beige);color:var(--brown);}

/* NAV */
nav{background:var(--white);border-bottom:1px solid var(--beige2);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 12px rgba(139,94,91,.07);}
.logo{font-family:'Playfair Display',serif;font-size:21px;color:var(--brown);text-decoration:none;}
.logo em{color:var(--rose-d);font-style:italic;}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--rose-d);}

/* HERO */
.hero{background:linear-gradient(135deg,var(--rose-p) 0%,#F0E0DC 100%);padding:56px 40px 72px;text-align:center;}
.hero small{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--rose-d);display:block;margin-bottom:14px;}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,52px);font-weight:400;line-height:1.2;margin-bottom:8px;}
.hero h1 em{color:var(--rose-d);}
.hero p{font-size:13px;color:var(--muted);}

/* SEARCH */
.search-wrap{max-width:1080px;margin:-32px auto 40px;padding:0 24px;}
.search-card{background:var(--white);border-radius:14px;box-shadow:0 4px 28px rgba(139,94,91,.11);padding:32px 36px;border:1px solid var(--beige2);}
.s-label{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--rose-d);margin-bottom:24px;display:flex;align-items:center;gap:12px;}
.s-label::after{content:'';flex:1;height:1px;background:var(--beige2);}
.s-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}
.f{display:flex;flex-direction:column;gap:7px;}
.f label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.f input,.f select{background:var(--beige);border:1px solid var(--beige2);border-radius:8px;color:var(--brown);font-family:'Jost',sans-serif;font-weight:300;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.f input:focus,.f select:focus{border-color:var(--rose-d);}
.f select option{background:white;}
.btn-search{display:block;margin:0 auto;background:var(--rose-d);color:white;border:none;border-radius:50px;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:13px 52px;cursor:pointer;transition:all .3s;box-shadow:0 3px 14px rgba(201,144,138,.35);}
.btn-search:hover{background:var(--rose-dk);transform:translateY(-1px);}

/* RESULTS */
.results-wrap{max-width:1080px;margin:0 auto;padding:0 24px 60px;}
.r-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.r-count{font-size:12px;color:var(--muted);}
.r-count strong{color:var(--rose-d);}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}

.card{background:var(--white);border-radius:12px;border:1px solid var(--beige2);padding:24px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--rose-d));transform:scaleX(0);transform-origin:left;transition:transform .3s;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,94,91,.12);}
.card:hover::after{transform:scaleX(1);}
.card-stars{color:var(--rose-d);font-size:11px;margin-bottom:8px;}
.card-chain{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.card-hotel{font-family:'Playfair Display',serif;font-size:16px;color:var(--brown);margin-bottom:14px;line-height:1.3;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:50px;background:var(--rose-p);color:var(--rose-dk);}
.card-amenities{font-size:11px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
.card-foot{display:flex;align-items:center;justify-content:space-between;}
.price .amount{font-family:'Playfair Display',serif;font-size:26px;color:var(--rose-d);}
.price .per{font-size:10px;color:var(--muted);}
.btn-reserver{background:transparent;border:1px solid var(--rose);color:var(--rose-d);border-radius:50px;font-family:'Jost',sans-serif;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;cursor:pointer;transition:all .2s;}
.btn-reserver:hover{background:var(--rose-d);border-color:var(--rose-d);color:white;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(92,61,58,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--white);border-radius:14px;padding:40px;width:100%;max-width:480px;position:relative;animation:up .3s ease;}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal-x{position:absolute;top:16px;right:20px;background:var(--beige);border:none;width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-x:hover{background:var(--rose-p);color:var(--rose-d);}
.modal-eyebrow{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--rose-d);margin-bottom:6px;}
.modal h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:400;margin-bottom:20px;}
.summary{background:var(--rose-p);border-radius:10px;padding:16px 18px;margin-bottom:20px;font-size:12px;line-height:1.8;}
.summary .total{font-family:'Playfair Display',serif;font-size:19px;color:var(--rose-d);display:block;margin-top:4px;}
.mf{margin-bottom:16px;}
.mf label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.mf input{width:100%;background:var(--beige);border:1px solid var(--beige2);border-radius:8px;color:var(--brown);font-family:'Jost',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .2s;}
.mf input:focus{border-color:var(--rose-d);}
.btn-confirm{width:100%;margin-top:4px;background:var(--rose-d);color:white;border:none;border-radius:50px;font-family:'Jost',sans-serif;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;padding:14px;cursor:pointer;transition:all .3s;box-shadow:0 3px 14px rgba(201,144,138,.35);}
.btn-confirm:hover{background:var(--rose-dk);}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--brown);color:var(--rose-p);border-radius:10px;padding:13px 22px;font-size:13px;box-shadow:0 6px 20px rgba(92,61,58,.2);transform:translateY(70px);opacity:0;transition:all .4s;z-index:300;max-width:300px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-left:4px solid var(--rose-d);}
.toast.err{border-left:4px solid var(--red);}

.loading{text-align:center;padding:50px;font-size:11px;letter-spacing:2px;color:var(--muted);}
.empty{text-align:center;padding:50px;color:var(--muted);}
.empty-ico{font-family:'Playfair Display',serif;font-size:44px;color:var(--rose);margin-bottom:12px;}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">e<em>·</em>Hôtels</a>
  <ul class="nav-links">
    <li><a href="index.html" class="active">Recherche</a></li>
    <li><a href="gestion.html">Gestion</a></li>
  </ul>
</nav>

<div class="hero">
  <small>Cinq chaînes · Quarante hôtels · Amérique du Nord</small>
  <h1>Trouvez votre chambre <em>idéale</em></h1>
  <p>Disponibilité en temps réel</p>
</div>

<div class="search-wrap">
  <div class="search-card">
    <p class="s-label">Critères de recherche</p>
    <div class="s-grid">
      <div class="f"><label>Arrivée</label><input type="date" id="dateDebut"></div>
      <div class="f"><label>Départ</label><input type="date" id="dateFin"></div>
      <div class="f">
        <label>Capacité</label>
        <select id="capacite">
          <option value="">Toutes</option>
          <option value="simple">Simple</option>
          <option value="double">Double</option>
          <option value="triple">Triple</option>
          <option value="suite">Suite</option>
        </select>
      </div>
      <div class="f">
        <label>Chaîne</label>
        <select id="chaine">
          <option value="">Toutes</option>
          <option>HorizonHotels</option>
          <option>PeakResorts</option>
          <option>MapleStay</option>
          <option>LakeviewSuites</option>
          <option>NorthernLodge</option>
        </select>
      </div>
      <div class="f">
        <label>Catégorie</label>
        <select id="categorie">
          <option value="">Toutes</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★</option>
          <option value="3">★★★</option>
          <option value="2">★★</option>
          <option value="1">★</option>
        </select>
      </div>
      <div class="f"><label>Prix max ($/nuit)</label><input type="number" id="prixMax" placeholder="Ex: 500"></div>
      <div class="f"><label>Superficie min (m²)</label><input type="number" id="superficieMin" placeholder="Ex: 25"></div>
    </div>
    <button class="btn-search" onclick="rechercher()">Rechercher les chambres</button>
  </div>
</div>

<div class="results-wrap">
  <div id="r-header" class="r-header" style="display:none">
    <p class="r-count"><strong id="r-count">0</strong> chambre(s) disponible(s)</p>
  </div>
  <div id="rooms" class="rooms"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <p class="modal-eyebrow">Réservation</p>
    <h2>Vos informations</h2>
    <div class="summary" id="summary"></div>
    <div class="mf"><label>Nom complet</label><input id="rNom" placeholder="Marie Tremblay"></div>
    <div class="mf"><label>NAS</label><input id="rNas" placeholder="000-000-000"></div>
    <div class="mf"><label>Adresse</label><input id="rAdresse" placeholder="123 rue Principale, Ottawa, ON"></div>
    <button class="btn-confirm" onclick="confirmer()">Confirmer la réservation</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8080';
let sel = null, dates = {};

// Dates par défaut
const t=new Date(), t1=new Date(t), t2=new Date(t);
t1.setDate(t.getDate()+1); t2.setDate(t.getDate()+7);
document.getElementById('dateDebut').value = t1.toISOString().split('T')[0];
document.getElementById('dateFin').value   = t2.toISOString().split('T')[0];

async function rechercher() {
  const dd=v('dateDebut'), df=v('dateFin'), cap=v('capacite'),
        ch=v('chaine'), cat=v('categorie'), pm=v('prixMax'), sf=v('superficieMin');
  if (!dd||!df){toast('Veuillez sélectionner les dates','err');return;}
  if (df<=dd){toast('La date de départ doit être après l\'arrivée','err');return;}
  dates={dd,df};
  const p=new URLSearchParams({dateDebut:dd,dateFin:df});
  if(cap)p.append('capacite',cap); if(ch)p.append('chaine',ch);
  if(cat)p.append('categorie',cat); if(pm)p.append('prixMax',pm);
  if(sf)p.append('superficieMin',sf);
  document.getElementById('r-header').style.display='none';
  document.getElementById('rooms').innerHTML='<div class="loading">Recherche en cours…</div>';
  try {
    const data=await(await fetch(`${API}/api/chambres?${p}`)).json();
    afficher(data);
  } catch(e){
    document.getElementById('rooms').innerHTML='<div class="empty"><div class="empty-ico">✦</div><p>Serveur inaccessible.<br>Vérifiez que run.bat est lancé.</p></div>';
  }
}

function afficher(chambres){
  document.getElementById('r-header').style.display='flex';
  document.getElementById('r-count').textContent=chambres.length;
  if(!chambres.length){
    document.getElementById('rooms').innerHTML='<div class="empty"><div class="empty-ico">✦</div><p>Aucune chambre disponible pour ces critères.</p></div>';
    return;
  }
  document.getElementById('rooms').innerHTML=chambres.map(c=>`
    <div class="card" onclick='openModal(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <div class="card-stars">${'★'.repeat(c.categorie)}${'☆'.repeat(5-c.categorie)}</div>
      <p class="card-chain">${c.chaine}</p>
      <h3 class="card-hotel">${c.hotel}</h3>
      <div class="tags">
        <span class="tag">${c.capacite}</span>
        <span class="tag">Vue ${c.vue}</span>
        <span class="tag">${c.superficie} m²</span>
        ${c.litSup?'<span class="tag">Lit suppl.</span>':''}
      </div>
      <p class="card-amenities">${c.commodites}</p>
      <div class="card-foot">
        <div class="price"><div class="amount">$${c.prix}</div><div class="per">par nuit</div></div>
        <button class="btn-reserver">Réserver</button>
      </div>
    </div>`).join('');
}

function openModal(c){
  sel=c;
  const n=Math.max(1,Math.round((new Date(dates.df)-new Date(dates.dd))/86400000));
  const tot=(c.prix*n).toFixed(2);
  document.getElementById('summary').innerHTML=`
    <strong>${c.hotel}</strong><br>${c.chaine} · ${'★'.repeat(c.categorie)}<br>
    Chambre ${c.capacite} · Vue ${c.vue} · ${c.superficie} m²<br>
    <em>${dates.dd} → ${dates.df} · ${n} nuit(s)</em>
    <span class="total">$${tot} CAD</span>`;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){document.getElementById('overlay').classList.remove('open');sel=null;}

async function confirmer(){
  const nom=v('rNom'),nas=v('rNas'),adr=v('rAdresse');
  if(!nom||!nas||!adr){toast('Remplissez tous les champs','err');return;}
  try{
    const body=new URLSearchParams({chambreId:sel.chambreId,dateDebut:dates.dd,dateFin:dates.df,nas,nomComplet:nom,adresse:adr});
    const data=await(await fetch(`${API}/api/reservation`,{method:'POST',body})).json();
    if(data.success){closeModal();toast(`Réservation #${data.reservationId} confirmée !`,'ok');rechercher();}
    else toast('Erreur : '+(data.erreur||'inconnue'),'err');
  }catch(e){toast('Erreur serveur','err');}
}

function v(id){return document.getElementById(id).value.trim();}
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+type+' show';
  setTimeout(()=>el.classList.remove('show'),4000);
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
</script>
</body>
</html>
